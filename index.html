"],answer:"C",answerText:"现场风速"},{id:256,chapter:"第四章 空气理化检验",section:"第三节气象条件的测定",no:15,stem:"使用示踪气体浓度衰减法测定新风量时，需要测量示踪气体在室内的",options:["初始浓度和衰减一段时间后的浓度","最大浓度和最小浓度","仅在室外的本底浓度","仅在通风口的浓度","全天平均浓度"],answer:"A",answerText:"初始浓度和衰减一段时间后的浓度"},{id:257,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:1,stem:"以下哪个说法错误",options:["粉尘的浓度与其人体的危害的程度呈正相关","粉尘的溶解性越大对人体的毒害越大","质量相同的粉尘，越接近球形沉降速率越快","粉尘颗粒大小相同，相对密度大的在空气中稳定性小","粉尘主要是固态物质在自然风化或人工破碎过程中形成的"],answer:"B",answerText:"粉尘的溶解性越大对人体的毒害越大"},{id:258,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:2,stem:"关于粉尘分散度的说法，下列错误的是",options:["分散度有粒子分散度和质量分散度","单位质量中，粉尘的颗粒数越多，分散度越大","单位质量中，粉尘粒径愈小的颗粒数越多，分散度越大","分散度越高，其沉降速率越快","粉尘在空气中漂浮时间的长短与粉尘粒子的密度和性状密切相关"],answer:"D",answerText:"分散度越高，其沉降速率越快"},{id:259,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:3,stem:"两尺重合的刻度线之间目镜测微尺有45个刻度，物镜测微尺有10个刻度，则目镜测微尺的一个刻度相当于 μm。",options:["2.0","2.2","2.5","3.5","4.5"],answer:"B",answerText:"2.2"},{id:260,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:4,stem:"分散度测定时，每个标本至少要测定多少个尘粒",options:["100","150","200","250","300"],answer:"C",answerText:"200"},{id:261,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:5,stem:"焦磷酸在245-250℃的高温下，不会与下面哪种物质起反应",options:["硅酸钾","二氧化硅","三氧化二铁","硅酸钠","硅酸"],answer:"B",answerText:"二氧化硅"},{id:262,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:6,stem:"焦磷酸质量法加入硝酸铵的目的是",options:["作为催化剂，提高反应速率","能够溶解碳化硅）黄玉等杂质","降低反应时的温度，使反应更完全","使硫化物和有机物被氧化去除","提高反应时的温度，使反应更完全"],answer:"D",answerText:"使硫化物和有机物被氧化去除"},{id:263,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:7,stem:"二氧化硫（SO2. 可与水分）尘粒结合形成",options:["气溶胶","气体","蒸汽","雾","烟"],answer:"A",answerText:"气溶胶"},{id:264,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:8,stem:"我国卫生标准规定，居住区大气中SO2的最该允许浓度为 mg/m3",options:["0.1","0.2","0.5","0.8","1.0"],answer:"C",answerText:"0.5"},{id:265,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:9,stem:"我国卫生标准规定，车间空气中SO2的最该允许浓度为 mg/m3",options:["0.5","5","15","25","50"],answer:"C",answerText:"15"},{id:266,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:10,stem:"四氯汞钾溶
