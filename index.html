s:["测定时间","环境噪声","现场风速","大气压强","仪器颜色"],answer:"C",answerText:"现场风速"},{id:256,chapter:"第四章 空气理化检验",section:"第三节气象条件的测定",no:15,stem:"使用示踪气体浓度衰减法测定新风量时，需要测量示踪气体在室内的",options:["初始浓度和衰减一段时间后的浓度","最大浓度和最小浓度","仅在室外的本底浓度","仅在通风口的浓度","全天平均浓度"],answer:"A",answerText:"初始浓度和衰减一段时间后的浓度"},{id:257,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:1,stem:"以下哪个说法错误",options:["粉尘的浓度与其人体的危害的程度呈正相关","粉尘的溶解性越大对人体的毒害越大","质量相同的粉尘，越接近球形沉降速率越快","粉尘颗粒大小相同，相对密度大的在空气中稳定性小","粉尘主要是固态物质在自然风化或人工破碎过程中形成的"],answer:"B",answerText:"粉尘的溶解性越大对人体的毒害越大"},{id:258,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:2,stem:"关于粉尘分散度的说法，下列错误的是",options:["分散度有粒子分散度和质量分散度","单位质量中，粉尘的颗粒数越多，分散度越大","单位质量中，粉尘粒径愈小的颗粒数越多，分散度越大","分散度越高，其沉降速率越快","粉尘在空气中漂浮时间的长短与粉尘粒子的密度和性状密切相关"],answer:"D",answerText:"分散度越高，其沉降速率越快"},{id:259,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:3,stem:"两尺重合的刻度线之间目镜测微尺有45个刻度，物镜测微尺有10个刻度，则目镜测微尺的一个刻度相当于 μm。",options:["2.0","2.2","2.5","3.5","4.5"],answer:"B",answerText:"2.2"},{id:260,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:4,stem:"分散度测定时，每个标本至少要测定多少个尘粒",options:["100","150","200","250","300"],answer:"C",answerText:"200"},{id:261,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:5,stem:"焦磷酸在245-250℃的高温下，不会与下面哪种物质起反应",options:["硅酸钾","二氧化硅","三氧化二铁","硅酸钠","硅酸"],answer:"B",answerText:"二氧化硅"},{id:262,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:6,stem:"焦磷酸质量法加入硝酸铵的目的是",options:["作为催化剂，提高反应速率","能够溶解碳化硅）黄玉等杂质","降低反应时的温度，使反应更完全","使硫化物和有机物被氧化去除","提高反应时的温度，使反应更完全"],answer:"D",answerText:"使硫化物和有机物被氧化去除"},{id:263,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:7,stem:"二氧化硫（SO2. 可与水分）尘粒结合形成",options:["气溶胶","气体","蒸汽","雾","烟"],answer:"A",answerText:"气溶胶"},{id:264,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:8,stem:"我国卫生标准规定，居住区大气中SO2的最该允许浓度为 mg/m3",options:["0.1","0.2","0.5","0.8","1.0"],answer:"C",answerText:"0.5"},{id:265,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:9,stem:"我国卫生标准规定，车间空气中SO2的最该允许浓度为 mg/m3",options:["0.5","5","15","25","50"],answer:"C",answerText:"15"},{id:266,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:10,stem:"四氯汞钾溶液-盐酸副玫瑰苯胺(品红)分光光度法检测SO2生成 络合物",options:["蓝绿色","红黄色","蓝紫色","紫红色","紫蓝色"],answer:"D",answerText:"紫红色"},{id:267,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:11,stem:"下列粉尘中，属于人工有机粉尘的是",options:["石英粉尘","棉尘","煤尘","合成树脂粉尘","石棉粉尘"],answer:"D",answerText:"合成树脂粉尘"},{id:268,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:12,stem:"粉尘的哪种理化性质直接影响其在空气中的悬浮时间，并可能与人体危害程度相关？",options:["颜色","溶解度","荷电性","形状","硬度"],answer:"C",answerText:"荷电性"},{id:269,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:13,stem:"我国统一采用的测定工作场所空气中粉尘浓度的方法是",options:["计数法","X线衍射法","滤膜质量法","分光光度法","激光散射法"],answer:"C",answerText:"滤膜质量法"},{id:270,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:14,stem:"用滤膜质量法测定粉尘浓度时，采样点的高度通常设在",options:["地面附近（0.1-0.5米）","人的呼吸带高度（约1.5米）","屋顶附近（2.5米以上）","任意高度均可","根据粉尘来源高度确定"],answer:"B",answerText:"人的呼吸带高度（约1.5米）"},{id:271,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:15,stem:"粉尘中游离二氧化硅的测定，常用焦磷酸质量法。该方法中，焦磷酸的作用是",options:["溶解所有粉尘成分","与硅酸盐反应生成可溶物，使游离二氧化硅残留","作为氧化剂氧化二氧化硅","作为显色剂进行比色测定","吸附粉尘中的金属离子"],answer:"B",answerText:"与硅酸盐反应生成可溶物，使游离二氧化硅残留"},{id:272,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:16,stem:"甲醛-盐酸副玫瑰苯胺分光光度法测定空气中二氧化硫时，吸收液与二氧化硫反应生成的稳定中间产物是",options:["亚硫酸根","硫酸根","羟甲基磺酸","三氧化硫","硫代硫酸根"],answer:"C",answerText:"羟甲基磺酸"},{id:273,chapter:"第四章 空气理化检验",section:"第五节空气中有毒物质的测定",no:17,stem:"关于粉尘分散度的卫生学意义，下列说法正确的是",options:["分散度越低，对人体危害越大","分散度越高，在空气中沉降越快","分散度越高，进入呼吸道深部的机会越多","分散度与粉尘的溶解度无关","质量分散度是常用指标"],answer:"C",answerText:"分散度越高，进入呼吸道深部的机会越多"}]};var Kt=ei,Ln=ei.questions,gd=ei.chapters,Pn="all";var ti=e=>(e===Pn?Ln:Ln.filter(n=>n.chapter===e)).map(n=>({...n,options:[...n.options]})),ni=e=>{let t=[...e];for(let n=t.length-1;n>0;n--){let r=Math.floor(Math.random()*(n+1));[t[n],t[r]]=[t[r],t[n]]}return t};var wd=(e,t)=>e===0?0:Number((t*100/e).toFixed(2)),xd=e=>e>=90?{grade:"优秀",remarks:"非常棒！这一部分你已经掌握得很扎实了。"}:e>=80?{grade:"良好",remarks:"不错！把错题再过一遍就稳了。"}:e>=70?{grade:"中等",remarks:"还可以，重点回看标红的错题。"}:e>=60?{grade:"及格",remarks:"刚及格，建议对照课本把错题所在小节重读一遍。"}:{grade:"不及格",remarks:"别急，先集中攻错题，再来一轮会有明显提升。"},yd=(e=0)=>{let t=Math.max(0,Math.floor(e/1e3));return{hours:Math.floor(t/3600),minutes:Math.floor(t%3600/60),seconds:t%60}};var fm=[{test:/卫生理化检验|检验技术的?基本|理化检验技术.{0,6}(特点|作用|任务)/,text:"卫生理化检验是用物理、化学及仪器分析手段，对与健康相关的食品、水、空气、土壤等样品中的成分和有害物质进行定性、定量分析，为卫生监督与评价提供数据依据。"},{test:/国家标准|GB\s*\d|标准方法|检测方法标准/,text:"卫生检验方法以国家标准（GB、GB/T）、行业标准为主，检验报告应注明所用方法标准与检出限，超范围使用需方法学验证。"},{test:/随机误差|系统误差|偶然误差|过失误差|误差的?来源/,text:"误差分三类：随机误差（不可消除，用重复测定、多次平均减小）、系统误差（可校正，来自方法、试剂、仪器、操作）、过失误差（人为，必须剔除数据重测）。"},{test:/精密度|准确度|重复性|重现性/,text:"准确度反映测量值与真值的接近程度（常用加标回收率、标准物质评价）；精密度反映多次测定结果的一致程度（用标准差、RSD 评价）。精密度高不等于准确度高。"},{test:/有效数字|修约|有效位数/,text:"有效数字从左边第一个非零数字算起；修约遵循「四舍六入五成双」，且只能一次修约到位，不能连续修约。"},{test:/采样(量|数|方案|代表性)|样品代表性|采样点/,text:"采样的核心是「代表性」：样品必须能代表整批待检物。采样量需满足检验、复检和留样需要，一般不少于检验用量的 3 倍。"},{test:/空白试验|空白值|试剂空白/,text:"空白试验用于扣除试剂、器皿、环境带来的本底影响。空白值异常偏高通常提示试剂纯度不够、器皿污染或环境污染。"},{test:/标准曲线|工作曲线|相关系数|线性范围/,text:"标准曲线的相关系数 r 一般要求 ≥0.999；样品浓度应落在曲线线性范围内，过高需稀释、过低需浓缩。"},{test:/加标回收|回收率/,text:"加标回收率反映方法的准确度，一般要求在 80%~120%（痕量分析可放宽到 70%~130%），过低或过高都提示存在基体干扰或损失。"},{test:/检出限|最低检出|灵敏度/,text:"检出限（LOD）通常按 3 倍空白标准差对应浓度估算，定量限（LOQ）约为 10 倍；报告「未检出」时应同时给出检出限。"},{test:/平行样|平行测定|双份/,text:"平行样用于监控精密度，一般要求相对偏差在允许范围内；超出范围说明操作或仪器不稳定，需重做。"},{test:/留样|样品保存|保存(期|条件)/,text:"留样用于复检和纠纷处理，应在规定的保存条件（冷藏、避光、密封）下保存至保质期后一定时间，并做好标识。"},{test:/水样|水质|饮用水|水源水|地表水|地下水/,text:"水质检验的采样、保存、检验全过程都受国标约束（如 GB 5749 生活饮用水卫生标准、GB/T 5750 检验方法），采样后应尽快测定，不能及时测定的需按项目加保存剂冷藏。"},{test:/pH|酸碱度/,text:"pH 反映水的酸碱状况，生活饮用水标准为 6.5~8.5。pH 会影响混凝、消毒效果和管道腐蚀，应与碱度、硬度等指标结合判断。"},{test:/浊度|浑浊度/,text:"浊度反映水中悬浮颗粒对光线的散射程度，单位为 NTU，生活饮用水限值 1 NTU。浊度高会遮蔽微生物、削弱消毒效果。"},{test:/色度|臭和味|肉眼可见物/,text:"色度、臭和味、肉眼可见物属于感官性状指标，是判断水质是否受到污染最直观的线索。"},{test:/总硬度|钙镁|碳酸盐硬度/,text:"总硬度主要由钙、镁离子构成，以 CaCO₃ 计，生活饮用水限值 450 mg/L。硬度过高影响口感和洗涤，也与结石风险相关。"},{test:/溶解氧|DO|生化需氧量|BOD|化学需氧量|COD|高锰酸盐指数/,text:"BOD、COD、高锰酸盐指数都反映水中有机物污染程度：COD 是化学氧化剂消耗量，BOD 是微生物分解耗氧量，高锰酸盐指数偏重易氧化有机物。溶解氧越低，通常污染越重。"},{test:/氨氮|亚硝酸盐|硝酸盐|三氮/,text:"「三氮」（氨氮、亚硝酸盐氮、硝酸盐氮）的变化可指示含氮有机物的分解阶段：氨氮高说明新近污染，硝酸盐升高说明已充分氧化，亚硝酸盐出现常提示污染仍在持续。"},{test:/氯化物|硫酸盐|氟化物|总磷|总氮/,text:"氯化物、硫酸盐主要影响口感和腐蚀性；氟化物适量防龋、过量致氟斑牙氟骨症；总磷总氮是水体富营养化的关键指标。"},{test:/重金属|铅|镉|汞|砷|铬|铜|锌|锰|铁/,text:"金属指标检测常用原子吸收（AAS）、电感耦合等离子体质谱（ICP-MS）、原子荧光（砷、汞）。采样需用酸洗容器并加硝酸酸化保存。"},{test:/余氯|游离氯|总氯|消毒剂|二氧化氯|臭氧/,text:"余氯是保证管网持续消毒能力的关键，出厂水游离余氯与水接触 30 min 后应不低于 0.3 mg/L，管网末梢不低于 0.05 mg/L。"},{test:/总大肠菌群|菌落总数|耐热大肠菌|大肠埃希氏|微生物/,text:"微生物指标是水质安全的核心：总大肠菌群、耐热大肠菌群、大肠埃希氏菌均不得检出，菌落总数限值 100 CFU/mL。检出即提示存在粪便污染风险。"},{test:/挥发酚|阴离子合成洗涤剂|石油类|苯并|多环芳烃/,text:"挥发酚、阴离子合成洗涤剂、石油类等属于有机污染指标，多与工业废水和生活污水排放有关，检测常用萃取-分光光度法或气相/液相色谱法。"},{test:/沉积物|底泥/,text:"沉积物（底泥）是重金属和持久性有机污染物的「汇」，其含量能反映水体的长期累积污染状况，是评价水体历史污染的重要依据。"},{test:/水样(的)?采集|采样瓶|采样容器|保存剂/,text:"采样容器的材质要与测定项目匹配：测金属用聚乙烯或硬质玻璃并酸洗，测有机物用棕色玻璃瓶，测微生物需无菌瓶并及时冷藏送检。"},{test:/食品|营养成分|添加剂|保健食品|食物中毒|食品包装|食品器具/,text:"食品理化检验覆盖营养成分、食品添加剂、有害物质、微生物以及包装材料迁移物等，依据 GB 2760、GB 2762、GB 29921 等强制性标准判定。"},{test:/蛋白质|凯氏定氮|氮含量/,text:"蛋白质测定常用凯氏定氮法：消化（硫酸+催化剂）→蒸馏（碱性蒸馏出氨）→滴定（硼酸吸收后盐酸滴定），将含氮量乘以换算系数得到蛋白质含量。"},{test:/脂肪|索氏提取|粗脂肪/,text:"脂肪测定常用索氏提取法，用无水乙醚或石油醚回流提取，提取物干燥恒重后称量，结果称「粗脂肪」。"},{test:/水分|干燥法|灰分|灼烧/,text:"水分常用常压干燥法（105℃恒重）；灰分用高温灼烧（550℃）后残留的无机物质量，二者配合可推算无氮浸出物等指标。"},{test:/碳水化合物|还原糖|总糖|蔗糖|葡萄糖/,text:"还原糖测定常用斐林试剂滴定法（直接滴定或高锰酸钾法），总糖需先水解为还原糖再测定。"},{test:/维生素|维生|胡萝卜素|抗坏血酸/,text:"维生素类易受光、热、氧破坏，样品处理需避光、快速、低温；维生素 C 常用 2,6-二氯靛酚滴定法或荧光法。"},{test:/防腐剂|苯甲酸|山梨酸|甜味剂|糖精|色素|亚硝酸盐|硝酸盐|护色剂/,text:"食品添加剂检验依据 GB 2760 规定的品种和最大使用量。亚硝酸盐既是护色剂又是潜在致癌物前体，肉制品中残留量严格受限。"},{test:/农药残留|有机磷|氨基甲酸酯|拟除虫菊酯|农残/,text:"农药残留检测以气相色谱（GC）、液相色谱-质谱（LC-MS/MS）为主，样品需先经提取、净化（QuEChERS 等）再进样，并做回收率和重复性验证。"},{test:/兽药残留|抗生素|氯霉素|瘦肉精|克伦特罗/,text:"兽药残留多用 LC-MS/MS 或酶联免疫法筛查，阳性需用质谱法确证；氯霉素已被禁用，不得检出。"},{test:/黄曲霉毒素|真菌毒素|赭曲霉|呕吐毒素/,text:"真菌毒素多为痕量强毒性物质，检测常用免疫亲和柱净化 + 液相色谱荧光检测或 LC-MS/MS。黄曲霉毒素 B1 是强致癌物，花生、玉米中重点监控。"},{test:/苯并芘|多环芳烃|丙烯酰胺|杂环胺/,text:"苯并芘主要产生于烟熏、烧烤、油炸等高温加工过程，属多环芳烃类强致癌物，检测常用高效液相色谱荧光法。"},{test:/重金属|铅|镉|汞|砷|铝/,text:"食品中重金属限量见 GB 2762，常用石墨炉原子吸收、ICP-MS 检测。稻米中镉、水产品中汞与甲基汞是重点监控对象。"},{test:/食物中毒|细菌性|化学性|有毒动植物/,text:"食物中毒分为细菌性、化学性、有毒动植物和真菌毒素性四类；出现同类病人集中、共同进食史、潜伏期短等特征时应立即报告并保存剩余食物与呕吐物。"},{test:/沙门|金黄色葡萄球菌|副溶血|蜡样芽孢|肉毒/,text:"细菌性食物中毒常见病原：沙门氏菌（蛋肉）、金黄色葡萄球菌肠毒素（乳制品、剩饭）、副溶血性弧菌（海产品）、蜡样芽孢杆菌（剩米饭）、肉毒梭菌（厌氧罐头）。"},{test:/食品包装|包装材料|迁移|器皿|不锈钢|塑料/,text:"食品接触材料需做迁移试验，重点监控重金属（铅、镉、铬、镍）、甲醛、塑化剂、双酚 A 等在食品模拟物中的迁移量。"},{test:/样品采集|采样|抽样|随机抽样|分层抽样/,text:"食品抽样应遵循随机性和代表性原则，按 GB/T 2828 等标准确定样本量；易变质样品需冷链运输并在规定时限内检验。"},{test:/色谱|气相|液相|HPLC|GC|质谱/,text:"色谱法利用组分在固定相和流动相之间分配系数的差异实现分离：气相色谱适用于挥发性、热稳定物质，液相色谱适用于高沸点、热不稳定或极性大的物质，质谱用于结构确证与痕量定量。"},{test:/分光光度|比色|吸光度|朗伯比尔/,text:"分光光度法基于朗伯-比尔定律 A=εbc：吸光度与浓度成正比，前提是单色光、均匀、稀溶液。显色反应需控制 pH、显色剂用量、温度和时间。"},{test:/原子吸收|原子荧光|ICP/,text:"原子吸收利用基态原子对特征谱线的吸收定量，灵敏度高但不能同时多元素；ICP-MS 可多元素同时测定，线性范围宽。"},{test:/空气|大气|室内空气|气象|有毒物质|采样点/,text:"空气检验分为采样、气象条件测定和污染物测定三部分；采样点布设和采样流量、时间直接影响结果代表性。"},{test:/气象条件|温度|湿度|气压|风速|风向/,text:"温度、湿度、气压、风速风向既是空气样品的现场记录参数，也影响污染物扩散。采样时须同步记录，便于结果换算到标准状态体积。"},{test:/个体采样|定点采样|采样高度|呼吸带/,text:"评价人群暴露用个体采样（随身佩戴采样器）；评价工作场所污染水平用定点采样。采样高度一般取呼吸带（1.2~1.5 m）。"},{test:/标准状态|标准状况|换算|标况体积/,text:"空气污染物体积浓度通常换算到标准状态（0℃、101.325 kPa）后再计算，否则不同温压下结果不可比。"},{test:/粉尘|总粉尘|呼吸性粉尘|PM2\.5|PM10|颗粒物/,text:"粉尘采样分总粉尘和呼吸性粉尘，需按粒径选择采样头与流量；PM2.5、PM10 用分级采样器采集后称重或成分分析。"},{test:/一氧化碳|二氧化碳|二氧化硫|氮氧化物|臭氧/,text:"CO 与血红蛋白结合力强，是室内外空气重点监控气体；SO₂、NOx、O₃ 多与燃烧和光化学反应相关，常用化学比色或在线仪器测定。"},{test:/甲醛|苯|TVOC|挥发性有机|VOC/,text:"室内空气中甲醛、苯系物、TVOC 主要来自装修材料和家具，采样常用活性炭管吸附-热解吸或 2,4-二硝基苯肼吸收-液相色谱法。"},{test:/汞|铅|重金属|砷/,text:"空气中重金属多以颗粒物为载体，用滤膜采集后酸消解，再用原子吸收或 ICP-MS 测定。"}],mm={chapter:{第一章:"本章是总论，重点记忆：检验任务与分类、误差与数据处理、采样基本原则、质量控制措施（空白、平行、加标回收、标准曲线）。",第二章:"本章是水质检验，「物理性状—有机污染—无机/金属—消毒剂—微生物—采样保存」这条线索要串起来记。",第三章:"本章是食品检验，「营养成分—添加剂—有害物质—微生物—包装材料—食物中毒」六条线，每条对应一套标准方法和限值。",第四章:"本章是空气检验，采样设计（布点、流量、时长、呼吸带）+ 气象参数 + 标准状态换算是解题的固定套路。"},section:{}},Nl=e=>{if(!e)return"";let t=e.stem||"";for(let r of fm)if(r.test.test(t))return r.text;let n=(e.chapter||"").slice(0,3);return mm.chapter[n]||"本题考查教材本小节的基本概念与标准要求，回顾对应章节的知识点表可快速巩固。"};var El="huajian_quiz_user_v1",Td="huajian_quiz_users_v1",Cd="huajian_quiz_intro_v1",kd="huajian_quiz_session_v1",Sd="huajian_quiz_history_v1",On=e=>`huajian_quiz_session_v1::${e}`,Er=e=>`huajian_quiz_history_v1::${e}`,_l
